name: Build Windows EXE Installer

on:
  push:
    paths:
      - "pc-desktop/**"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch:

jobs:
  build-windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc-desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run unit and LAN sync tests
        run: npm test

      - name: Build Windows NSIS installer (.exe)
        run: npm run build:win

      - name: Upload Windows .exe installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aroma-POS-Windows-Installer
          path: |
            pc-desktop/dist/*.exe
            pc-desktop/dist/latest.yml
          if-no-files-found: error
